<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mari</title>
  <link rel="icon" id="favicon" href="/static/mari.png" />
  <link rel="apple-touch-icon" href="/static/mari.png" />
  <style>
    :root {
      color-scheme: dark; background: var(--bg);
      --bg: #0d0f15; --bg2: #101320; --panel: #151926; --elev: #1b2130;
      --user: #3d6bff; --user2: #5f86ff; --mari: #e0a458;
      --text: #e8eaf2; --muted: #8b90a4; --faint: #5c6274; --line: #242a3a;
      --ok: #4fbf8f; --warn: #e0a458; --bad: #e5534b;
      --r: 14px; --shadow: 0 6px 20px rgba(0,0,0,.28);
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #eef0f6; --bg2: #e7eaf2; --panel: #ffffff; --elev: #ffffff;
      --user: #2b5cff; --user2: #4d78ff; --mari: #c07f2e;
      --text: #1b2030; --muted: #646b7e; --faint: #9aa0b2; --line: #e0e4ee;
      --ok: #2e9e73; --warn: #bd8330; --bad: #cf4038;
      --shadow: 0 6px 20px rgba(30,40,80,.10);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; height: 100vh; height: 100dvh;   /* dvh: avoids the iOS Safari toolbar cutting the bottom off */
      display: flex; flex-direction: column;
      background: radial-gradient(1200px 600px at 70% -10%, var(--bg2), var(--bg));  /* not 'fixed' — janky on iOS */
      color: var(--text);
      font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-thumb:hover { background: var(--faint); background-clip: padding-box; }

    /* ---------- Header ---------- */
    header {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px; border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--panel) 70%, transparent);
      backdrop-filter: blur(8px); position: relative; z-index: 10;
    }
    .avatar {
      width: 30px; height: 30px; border-radius: 50%; flex: none;
      display: grid; place-items: center; font-weight: 700; font-size: 14px; color: #1a1205;
      background: linear-gradient(145deg, var(--mari), #caa06a);
      box-shadow: 0 0 0 1px rgba(255,255,255,.08) inset;
    }
    header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .01em; }
    .conn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
    .conn .cdot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); transition: background .3s; }
    .conn.on .cdot { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    .conn.off .cdot { background: var(--bad); }
    .conn.wait .cdot { background: var(--warn); animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    .chip {
      font-size: 11px; color: var(--muted); background: var(--elev);
      border: 1px solid var(--line); border-radius: 20px; padding: 2px 10px;
      max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .spacer { flex: 1; }
    .hbtn {
      background: transparent; color: var(--muted); border: 1px solid var(--line);
      padding: 5px 12px; font: inherit; font-size: 12.5px; border-radius: 9px; cursor: pointer;
      transition: all .15s; display: inline-flex; align-items: center; gap: 6px;
    }
    .hbtn:hover { color: var(--text); border-color: var(--faint); background: var(--elev); }
    .hbtn.icon { padding: 5px 9px; }

    /* ---------- Layout ---------- */
    #main { flex: 1; display: flex; min-height: 0; }
    aside { flex: none; overflow-y: auto; }

    /* Sidebar */
    #sidebar {
      width: 214px; border-right: 1px solid var(--line); background: var(--bg2);
      padding: 12px 10px; display: flex; flex-direction: column; gap: 3px;
    }
    #newConv {
      background: var(--elev); color: var(--text); border: 1px dashed var(--line);
      padding: 9px 11px; border-radius: 10px; font: inherit; font-size: 13px; cursor: pointer;
      margin-bottom: 8px; text-align: left; transition: all .15s;
    }
    #newConv:hover { border-color: var(--user); color: var(--text); }
    .side-h { font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); padding: 4px 8px 6px; }
    .conv {
      display: flex; align-items: center; gap: 8px; padding: 8px 9px; border-radius: 9px;
      cursor: pointer; font-size: 13px; position: relative; transition: background .12s;
    }
    .conv:hover { background: var(--elev); }
    .conv.active { background: var(--elev); }
    .conv.active::before {
      content: ""; position: absolute; left: 0; top: 18%; bottom: 18%; width: 3px;
      border-radius: 3px; background: var(--user);
    }
    .conv .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .conv .n { color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
    .conv .del { color: var(--faint); font-size: 15px; opacity: 0; padding: 0 2px; transition: opacity .12s; }
    .conv:hover .del { opacity: .7; }
    .conv .del:hover { opacity: 1; color: var(--bad); }

    /* Chat column */
    #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
    #scroll { flex: 1; overflow-y: auto; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
    #log {
      padding: 22px 18px 8px; display: flex; flex-direction: column; gap: 3px;
      max-width: 780px; width: 100%; margin: 0 auto;
    }
    #empty {
      position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
      color: var(--muted); text-align: center; padding: 20px;
    }
    #empty .big { font-size: 15px; color: var(--text); margin-bottom: 4px; }
    #empty.hide { display: none; }

    .row { display: flex; align-items: flex-end; gap: 9px; margin-top: 10px; }
    .row.user { justify-content: flex-end; }
    .row .mavatar {
      width: 26px; height: 26px; border-radius: 50%; flex: none; margin-bottom: 2px;
      display: grid; place-items: center; font-weight: 700; font-size: 12px; color: #1a1205;
      background: linear-gradient(145deg, var(--mari), #caa06a);
    }
    .bubble {
      max-width: 74%; padding: 10px 14px; border-radius: var(--r); white-space: pre-wrap;
      word-wrap: break-word; position: relative; animation: rise .18s ease;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
    .user .bubble {
      background: linear-gradient(160deg, var(--user), var(--user2)); color: #fff;
      border-bottom-right-radius: 5px;
    }
    .bot .bubble {
      background: var(--elev); border: 1px solid var(--line); border-bottom-left-radius: 5px;
      box-shadow: var(--shadow);
    }
    .row .time {
      font-size: 10px; color: var(--faint); flex: none; opacity: 0; transition: opacity .15s;
      align-self: flex-end; margin-bottom: 3px; font-variant-numeric: tabular-nums;
    }
    .row:hover .time { opacity: 1; }
    .tag { font-size: 10px; color: var(--mari); letter-spacing: .04em; margin: 6px 0 -4px 35px; text-transform: uppercase; }
    .bubble.typing { display: inline-flex; gap: 4px; padding: 14px; }
    .bubble.typing .d { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
    .bubble.typing .d:nth-child(2) { animation-delay: .2s; }
    .bubble.typing .d:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%,60%,100% { opacity: .25; } 30% { opacity: 1; } }
    .stats { color: var(--faint); font-size: 11px; margin: 4px 4px 0 35px; font-variant-numeric: tabular-nums; }
    .sys { color: var(--muted); font-size: 12px; text-align: center; margin: 10px 0; font-style: italic; }
    .sys.quiet { color: var(--faint); font-size: 11px; font-style: normal; margin: 6px 0; }

    /* Composer */
    #composer {
      padding: 12px 16px 16px; border-top: 1px solid var(--line);
      max-width: 780px; width: 100%; margin: 0 auto;
    }
    form { display: flex; gap: 10px; align-items: flex-end; }
    #input {
      flex: 1; resize: none; background: var(--panel); color: var(--text);
      border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px;
      font: inherit; max-height: 150px; transition: border-color .15s;
    }
    #input:focus { outline: none; border-color: var(--user); }
    #send {
      background: linear-gradient(160deg, var(--user), var(--user2)); color: #fff; border: 0;
      border-radius: 12px; width: 44px; height: 44px; flex: none; cursor: pointer;
      display: grid; place-items: center; font-size: 18px; transition: filter .15s;
    }
    #send:hover { filter: brightness(1.08); }
    #send:disabled { opacity: .45; cursor: default; filter: none; }

    #jump {
      position: absolute; bottom: 92px; left: 50%; transform: translateX(-50%);
      background: var(--elev); color: var(--text); border: 1px solid var(--line);
      border-radius: 20px; padding: 6px 14px; font-size: 12px; cursor: pointer;
      box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    #jump.show { opacity: 1; pointer-events: auto; }

    /* Per-turn inspector */
    details.details { margin: 4px 0 2px 35px; max-width: 74%; }
    .details summary {
      color: var(--muted); font-size: 11px; cursor: pointer; list-style: none;
      user-select: none; padding: 3px 0;
    }
    .details summary:hover { color: var(--text); }
    .details summary::-webkit-details-marker { display: none; }
    .details summary::before { content: "▸"; font-size: 9px; display: inline-block; margin-right: 4px; transition: transform .15s; }
    .details[open] summary::before { transform: rotate(90deg); }
    .td-body {
      margin-top: 8px; padding: 12px 14px; background: var(--panel);
      border: 1px solid var(--line); border-radius: 12px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .td-title { color: var(--faint); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; margin-bottom: 7px; }
    .mem { font-size: 12.5px; padding: 3px 0; display: flex; gap: 8px; align-items: baseline; }
    .mem .pct { color: var(--muted); font-size: 11px; margin-left: auto; flex: none; font-variant-numeric: tabular-nums; }
    .td-empty { font-size: 12px; color: var(--muted); }

    .bar-row { display: grid; grid-template-columns: 96px 1fr 32px; align-items: center; gap: 9px; font-size: 12px; padding: 3px 0; }
    .bar-label { color: var(--text); text-transform: capitalize; }
    .bar { height: 6px; background: var(--line); border-radius: 6px; overflow: hidden; }
    .bar > i { display: block; height: 100%; border-radius: 6px; transition: width .4s ease; background: var(--user); }
    .bar-val { color: var(--muted); font-size: 11px; text-align: right; font-variant-numeric: tabular-nums; }

    /* ---------- Status panel ---------- */
    #status {
      width: 348px; border-left: 1px solid var(--line); background: var(--bg2);
      padding: 14px 14px 44px; display: flex; flex-direction: column; gap: 12px;
    }
    body.no-status #status { display: none; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; }
    .card > .st-h { margin-top: 0; }
    .st-h {
      color: var(--faint); font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
      margin: 0 0 9px; display: flex; align-items: center; gap: 6px;
    }
    .st-kv { font-size: 12.5px; display: flex; gap: 8px; align-items: baseline; padding: 2px 0; }
    .st-kv .k { color: var(--muted); }
    .st-kv .v { margin-left: auto; text-align: right; font-variant-numeric: tabular-nums; }
    .pill { font-size: 11px; padding: 2px 10px; border-radius: 20px; background: var(--elev); border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 5px; }
    .pill.awake { color: var(--ok); } .pill.awake .pdot { background: var(--ok); }
    .pill.asleep { color: #9b8fd0; } .pill.asleep .pdot { background: #9b8fd0; }
    .pill .pdot { width: 6px; height: 6px; border-radius: 50%; }
    .fam-track { height: 5px; background: var(--line); border-radius: 5px; overflow: hidden; margin-top: 8px; }
    .fam-track > i { display: block; height: 100%; background: linear-gradient(90deg, var(--user), var(--mari)); transition: width .4s; }
    .st-mem { font-size: 12.5px; padding: 3px 0; line-height: 1.4; }
    .st-mem.core { display: flex; gap: 6px; }
    .st-mem.core::before { content: "★"; color: var(--mari); flex: none; }
    .st-old { font-size: 11.5px; color: var(--muted); padding: 2px 0; }
    .st-old s { color: var(--faint); }
    .st-sub { color: var(--faint); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; margin: 9px 0 4px; }
    .st-thought { font-size: 12.5px; padding: 5px 0 5px 10px; border-left: 2px solid var(--line); margin: 6px 0; line-height: 1.45; }
    .st-thought .m { color: var(--mari); font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }
    .st-empty { color: var(--muted); font-size: 12px; }
    .count-chip { font-size: 10px; color: var(--muted); background: var(--elev); border: 1px solid var(--line); border-radius: 20px; padding: 1px 8px; margin-left: auto; font-variant-numeric: tabular-nums; letter-spacing: 0; }

    /* ---------- Memory modal ---------- */
    .modal { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(2px); animation: fade .15s; }
    @keyframes fade { from { opacity: 0; } }
    .modal.hidden { display: none; }
    .modal-box { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; width: min(760px, 94vw); max-height: 86vh; display: flex; flex-direction: column; box-shadow: var(--shadow); }
    .modal-head { display: flex; align-items: center; gap: 8px; padding: 15px 18px; border-bottom: 1px solid var(--line); font-weight: 650; }
    .modal-head .sub { color: var(--muted); font-weight: 400; font-size: 12px; }
    .modal-head .xbtn { margin-left: auto; background: transparent; color: var(--muted); border: 0; font-size: 24px; line-height: 1; padding: 0 4px; cursor: pointer; }
    .modal-head .xbtn:hover { color: var(--text); }
    .mem-filter { margin: 12px 16px 0; }
    .mem-filter input { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px; font: inherit; font-size: 13px; }
    .mem-filter input:focus { outline: none; border-color: var(--user); }
    .mem-list { overflow-y: auto; padding: 8px 16px; display: flex; flex-direction: column; }
    .mem-row { display: flex; align-items: center; gap: 9px; padding: 8px 2px; border-bottom: 1px solid var(--line); }
    .mem-row .star { background: transparent; border: 0; color: var(--faint); font-size: 16px; padding: 0 2px; cursor: pointer; flex: none; }
    .mem-row .star.on { color: var(--mari); }
    .mem-row input.mc { flex: 1; min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font: inherit; font-size: 13px; }
    .mem-row input.mc:focus { outline: none; border-color: var(--user); }
    .mem-row s { flex: 1; min-width: 0; color: var(--faint); font-size: 13px; }
    .mem-row .cat { color: var(--faint); font-size: 10px; text-transform: uppercase; letter-spacing: .04em; flex: none; }
    .mem-row .mbtn { background: var(--elev); color: var(--text); border: 1px solid var(--line); padding: 5px 10px; font: inherit; font-size: 12px; border-radius: 8px; flex: none; cursor: pointer; }
    .mem-row .mbtn:hover { border-color: var(--faint); }
    .mem-row .mbtn.del:hover { color: var(--bad); border-color: var(--bad); }
    .modal-foot { display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--line); }
    .modal-foot .grow { flex: 1; }
    .danger { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); border: 1px solid color-mix(in srgb, var(--bad) 45%, transparent); padding: 8px 14px; font: inherit; font-size: 13px; border-radius: 9px; cursor: pointer; }
    .danger:hover { background: color-mix(in srgb, var(--bad) 26%, transparent); }
    .mem-empty { color: var(--muted); font-size: 13px; padding: 28px; text-align: center; }

    .avatar.asleep { background: linear-gradient(145deg, #6b5fa0, #48416e); color: #e8e6f5; box-shadow: none; }
    .avatar { transition: box-shadow .5s; }

    /* copy-on-hover for bot messages */
    .row .copy { opacity: 0; background: transparent; border: 0; color: var(--faint); cursor: pointer; font-size: 11px; padding: 2px 4px; transition: opacity .15s; align-self: flex-end; margin-bottom: 3px; }
    .row.bot:hover .copy { opacity: .65; }
    .row .copy:hover { color: var(--text); }

    /* collapsible status cards */
    .st-h { cursor: pointer; user-select: none; }
    .st-h .st-h-title { flex: 1; }
    .st-h .chev { color: var(--faint); font-size: 9px; transition: transform .15s; }
    .card.collapsed .chev { transform: rotate(-90deg); }
    .card.collapsed > *:not(.st-h) { display: none; }
    .st-h .count-chip { margin-left: 0; }

    /* Responsive: fold panels away on narrow screens */
    /* Below 1080px the status panel becomes a right-side slide-over overlay, opened by the panel
       button and closed by tapping outside it; hidden by default via body.no-status. */
    @media (max-width: 1080px) {
      #status {
        position: fixed; top: 0; right: 0; bottom: 0; width: min(360px, 86vw);
        z-index: 40; box-shadow: -10px 0 30px rgba(0,0,0,.45);
      }
      body:not(.no-status)::after {
        content: ""; position: fixed; inset: 0; z-index: 39; background: rgba(0,0,0,.45);
      }
    }
    @media (max-width: 760px) { #sidebar { display: none; } }
    /* Phones: trim the header so nothing gets clipped, and tighten chat padding */
    @media (max-width: 640px) {
      header { padding: 9px 12px; gap: 9px; }
      .chip, #connText { display: none; }   /* keep the connection dot, drop its label + the model chip */
      .hbtn { padding: 5px 10px; }
      .bubble { max-width: 86%; }
      #log { padding-left: 12px; padding-right: 12px; }
      #composer { padding-left: 12px; padding-right: 12px; }
      /* iOS zooms in when focusing an input smaller than 16px; keep inputs at 16 on phones */
      #input, .mem-filter input, .mem-row input.mc { font-size: 16px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="avatar" id="avatar">M</div>
    <h1 id="botname">Mari</h1>
    <span class="conn" id="conn"><span class="cdot"></span><span id="connText">connecting</span></span>
    <span class="chip" id="model">…</span>
    <span class="spacer"></span>
    <button id="themeBtn" class="hbtn icon" type="button" title="toggle light / dark">☾</button>
    <button id="manageMem" class="hbtn" type="button">memory</button>
    <button id="toggleStatus" class="hbtn" type="button">panel</button>
  </header>

  <div id="main">
    <aside id="sidebar">
      <button id="newConv" type="button">+ New conversation</button>
      <div class="side-h">Conversations</div>
      <div id="convList"></div>
    </aside>

    <div id="chat">
      <div id="scroll">
        <div id="log"></div>
      </div>
      <div id="empty"><div><div class="big">Say hi to Mari 👋</div>She's a friend, not an assistant.</div></div>
      <button id="jump" type="button">↓ latest</button>
      <div id="composer">
        <form id="form">
          <textarea id="input" rows="1" placeholder="Say something…" autocomplete="off"></textarea>
          <button id="send" type="submit" title="send">↑</button>
        </form>
      </div>
    </div>

    <aside id="status"><div class="st-empty">loading…</div></aside>
  </div>

  <div id="memModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        Memory inspector <span class="sub" id="memCount"></span>
        <button id="memClose" class="xbtn" type="button" title="close">×</button>
      </div>
      <div class="mem-filter"><input id="memFilter" type="text" placeholder="filter memories…" autocomplete="off" /></div>
      <div id="memList" class="mem-list"></div>
      <div class="modal-foot">
        <button id="memClear" class="danger" type="button">clear all memories</button>
        <span class="grow"></span>
        <button id="memReset" class="danger" type="button">full reset</button>
      </div>
    </div>
  </div>

  <script>
    const log = document.getElementById("log");
    const scrollBox = document.getElementById("scroll");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const modelEl = document.getElementById("model");
    const botnameEl = document.getElementById("botname");
    const avatarEl = document.getElementById("avatar");
    const emptyEl = document.getElementById("empty");
    const jumpBtn = document.getElementById("jump");
    let botName = "Mari";
    let current = null; // active assistant bubble while streaming

    function el(tag, cls, text) {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    }
    const now = () => new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

    // --- scroll management: only auto-follow when already near the bottom ---
    function nearBottom() { return scrollBox.scrollHeight - scrollBox.scrollTop - scrollBox.clientHeight < 120; }
    function scrollDown(force) { if (force || nearBottom()) scrollBox.scrollTop = scrollBox.scrollHeight; }
    scrollBox.addEventListener("scroll", () => jumpBtn.classList.toggle("show", !nearBottom()));
    jumpBtn.onclick = () => scrollDown(true);
    function updateEmpty() { emptyEl.classList.toggle("hide", !!log.querySelector(".row")); }

    // --- proactive alerts: tab-title badge + browser notification + soft chime ---
    const favEl = document.getElementById("favicon");
    let unread = 0, curAsleep = false, audioCtx = null;
    function setFavicon() {
      const cv = document.createElement("canvas"); cv.width = cv.height = 64;
      const x = cv.getContext("2d");
      x.fillStyle = curAsleep ? "#6b5fa0" : "#e0a458";
      x.beginPath(); x.arc(32, 32, 30, 0, 7); x.fill();
      x.fillStyle = curAsleep ? "#e8e6f5" : "#1a1205";
      x.font = "bold 38px system-ui"; x.textAlign = "center"; x.textBaseline = "middle";
      x.fillText((botName[0] || "M"), 32, 35);
      if (unread > 0) { x.fillStyle = "#e5534b"; x.beginPath(); x.arc(50, 15, 13, 0, 7); x.fill(); }
      favEl.href = cv.toDataURL("image/png");
    }
    function chime() {
      if (!audioCtx) return;
      try {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.frequency.value = 660; o.connect(g); g.connect(audioCtx.destination);
        g.gain.value = 0.05; o.start();
        o.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.12);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
        o.stop(audioCtx.currentTime + 0.26);
      } catch (e) {}
    }
    function notify(text) {
      if (!document.hidden) return;   // she only "pings" you when you're looking elsewhere
      unread++; document.title = `(${unread}) ${botName}`; setFavicon(); chime();
      if ("Notification" in window && Notification.permission === "granted")
        try { new Notification(`${botName} messaged you`, { body: (text || "").slice(0, 120) }); } catch (e) {}
    }
    function armNotifs() {   // first user gesture: unlock audio + ask for notification permission
      if (!audioCtx) try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
      if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
    }
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) { unread = 0; document.title = botName; setFavicon(); }
    });

    function addBubble(role, text, opts = {}) {
      const row = el("div", "row " + role);
      if (opts.proactive) log.appendChild(el("div", "tag", "· reached out"));
      if (role === "bot") row.appendChild(el("div", "mavatar", botName[0] || "M"));
      const bubble = el("div", "bubble");
      bubble.textContent = text;
      if (role === "user") { row.appendChild(el("span", "time", opts.time || "")); row.appendChild(bubble); }
      else {
        row.appendChild(bubble); row.appendChild(el("span", "time", opts.time || ""));
        const copy = el("button", "copy", "copy");
        copy.title = "copy message";
        copy.onclick = () => {
          if (navigator.clipboard) navigator.clipboard.writeText(bubble.textContent);
          copy.textContent = "copied"; setTimeout(() => (copy.textContent = "copy"), 1000);
        };
        row.appendChild(copy);
      }
      log.appendChild(row);
      updateEmpty();
      scrollDown(role === "user");
      return bubble;
    }

    function addSys(text) { log.appendChild(el("div", "sys", text)); scrollDown(); }
    function addSilent() { log.appendChild(el("div", "sys quiet", "· Mari stayed quiet")); scrollDown(); }

    function addStats(s) {
      const approx = s.estimated ? "~" : "";
      log.appendChild(el("div", "stats", `ttft ${s.ttft.toFixed(2)}s · ${s.tok_per_s.toFixed(1)} tok/s · ${approx}${s.tokens} tok`));
      scrollDown();
    }

    // Distinct hue per mood channel so the six bars read at a glance.
    const MOOD_COLORS = {
      irritation: "#e5534b", warmth: "#e0a458", amusement: "#d9c04f",
      melancholy: "#6a8bd0", unease: "#9b7bd0", interest: "#4fbf8f",
    };
    const DRIVE_COLORS = { connection: "#4f9bd9", restlessness: "#d98f4f", energy: "#5cc98f" };

    function barRow(label, value, color) {
      const row = el("div", "bar-row");
      row.appendChild(el("span", "bar-label", label));
      const bar = el("span", "bar");
      const fill = el("i");
      fill.style.width = Math.round(Math.max(0, Math.min(1, value)) * 100) + "%";
      if (color) fill.style.background = color;
      bar.appendChild(fill);
      row.appendChild(bar);
      row.appendChild(el("span", "bar-val", value.toFixed(2).replace(/^0/, "")));
      return row;
    }
    function section(title) { const s = el("div", "td-section"); s.appendChild(el("div", "td-title", title)); return s; }

    // Collapsible per-turn inspector: core + recalled + felt + tools.
    function addDetails(recalled, emotion, core, tools) {
      recalled = recalled || []; core = core || []; tools = tools || [];
      const hasEmotion = emotion && emotion.mood;
      if (!recalled.length && !hasEmotion && !core.length && !tools.length) return;

      const details = el("details", "details");
      const summary = el("summary");
      const bits = [];
      if (core.length) bits.push(`${core.length} core`);
      bits.push(`${recalled.length} ${recalled.length === 1 ? "memory" : "memories"}`);
      if (tools.length) bits.push(`${tools.length} tool${tools.length === 1 ? "" : "s"}`);
      if (hasEmotion) { const top = Object.entries(emotion.mood).sort((a, b) => b[1] - a[1])[0]; bits.push(`mood: ${top[0]}`); }
      summary.textContent = "inspect · " + bits.join(" · ");
      details.appendChild(summary);

      const body = el("div", "td-body");
      if (tools.length) {
        const ts = section("Tools called");
        tools.forEach((t) => {
          const row = el("div", "mem");
          row.appendChild(el("span", null, `${t.name}(${t.args || ""})`));
          row.appendChild(el("span", "pct", "🔧"));
          ts.appendChild(row);
          if (t.result) ts.appendChild(el("div", "td-empty", "→ " + t.result));
        });
        body.appendChild(ts);
      }
      if (core.length) {
        const coreSec = section("Core memory (always known)");
        core.forEach((c) => coreSec.appendChild(el("div", "mem", c)));
        body.appendChild(coreSec);
      }
      const mem = section("Recalled memories");
      if (recalled.length) {
        recalled.forEach((m) => {
          const row = el("div", "mem");
          row.appendChild(el("span", null, m.content));
          row.appendChild(el("span", "pct", Math.round(m.similarity * 100) + "%"));
          mem.appendChild(row);
        });
      } else { mem.appendChild(el("div", "td-empty", "none pulled for this turn")); }
      body.appendChild(mem);

      if (hasEmotion) {
        const det = section("Detected in your message");
        const found = emotion.detected || [];
        if (found.length) found.forEach((d) => det.appendChild(barRow(d.label, d.score)));
        else det.appendChild(el("div", "td-empty", "neutral / nothing notable"));
        body.appendChild(det);
        const mood = section("Mari's mood");
        Object.entries(emotion.mood).forEach(([ch, v]) => mood.appendChild(barRow(ch, v, MOOD_COLORS[ch])));
        body.appendChild(mood);
      }
      details.appendChild(body);
      log.appendChild(details);
      scrollDown();
    }

    // --- WebSocket with auto-reconnect ---
    const conn = document.getElementById("conn");
    const connText = document.getElementById("connText");
    let socket = null, retry = 0;
    function setConn(state, label) { conn.className = "conn " + state; connText.textContent = label; }

    function connect() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      setConn("wait", "connecting");
      socket = new WebSocket(`${proto}://${location.host}/ws`);
      socket.onopen = () => { retry = 0; setConn("on", "connected"); };
      socket.onmessage = handleMessage;
      socket.onclose = () => {
        setConn("off", "reconnecting…");
        current = null; setSending(false);
        retry = Math.min(retry + 1, 6);
        setTimeout(connect, 500 * retry);
      };
      socket.onerror = () => socket.close();
    }
    function wsSend(obj) { if (socket && socket.readyState === 1) socket.send(JSON.stringify(obj)); }

    function handleMessage(ev) {
      const msg = JSON.parse(ev.data);
      if (msg.type === "ready") {
        botName = msg.bot; botnameEl.textContent = msg.bot;
        avatarEl.textContent = (msg.bot || "M")[0]; modelEl.textContent = msg.model;
      } else if (msg.type === "conversations") {
        renderConversations(msg.list, msg.active);
      } else if (msg.type === "history_start") {
        log.innerHTML = ""; current = null; updateEmpty();
      } else if (msg.type === "history") {
        addBubble(msg.role === "user" ? "user" : "bot", msg.content);
      } else if (msg.type === "proactive") {
        current = null; addBubble("bot", msg.content, { proactive: true, time: now() });
        notify(msg.content);
      } else if (msg.type === "waking") {
        addSys("waking up… reloading the model");
      } else if (msg.type === "start") {
        current = addBubble("bot", "", { time: now() });
        current.classList.add("typing");
        current.append(el("span", "d"), el("span", "d"), el("span", "d"));
      } else if (msg.type === "token") {
        if (!current) current = addBubble("bot", "", { time: now() });
        if (current.classList.contains("typing")) { current.classList.remove("typing"); current.textContent = ""; }
        current.textContent += msg.text; scrollDown();
      } else if (msg.type === "done") {
        if (msg.silent) {
          if (current) { const r = current.closest(".row"); if (r) r.remove(); }
          addSilent();
        } else {
          addStats(msg.stats);
          addDetails(msg.recalled, msg.emotion, msg.core, msg.tools);
        }
        current = null; setSending(false);
      } else if (msg.type === "error") {
        if (current) { current.classList.remove("typing"); current.textContent += `\n[error: ${msg.message}]`; }
        current = null; setSending(false);
      }
    }

    function setSending(on) {
      sendBtn.disabled = on; input.disabled = on;
      if (!on) input.focus();
    }
    function submit() {
      const text = input.value.trim();
      if (!text || sendBtn.disabled) return;
      armNotifs();
      addBubble("user", text, { time: now() });
      wsSend({ type: "user", text });
      input.value = ""; input.style.height = "auto"; setSending(true);
    }
    form.addEventListener("submit", (e) => { e.preventDefault(); submit(); });
    input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); } });
    input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 150) + "px"; });
    connect();

    // --- Theme toggle (persisted) ---
    const themeBtn = document.getElementById("themeBtn");
    function applyTheme(t) {
      document.documentElement.setAttribute("data-theme", t);
      themeBtn.textContent = t === "light" ? "☀" : "☾";
    }
    applyTheme(localStorage.getItem("mari-theme") || "dark");
    themeBtn.onclick = () => {
      const t = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
      localStorage.setItem("mari-theme", t); applyTheme(t);
    };

    // --- Status panel ---
    function fmtAgo(secs) {
      if (secs == null) return "—";
      if (secs < 60) return secs + "s ago";
      if (secs < 3600) return Math.round(secs / 60) + "m ago";
      return Math.round(secs / 3600) + "h ago";
    }
    function kvRow(k, v) { const r = el("div", "st-kv"); r.appendChild(el("span", "k", k)); r.appendChild(el("span", "v", v)); return r; }
    const COLLAPSE_KEY = "mari-collapsed";
    const collapsedSet = () => new Set(JSON.parse(localStorage.getItem(COLLAPSE_KEY) || "[]"));
    function card(title, chip) {
      const c = el("div", "card");
      const h = el("div", "st-h");
      h.appendChild(el("span", "st-h-title", title));
      if (chip != null) h.appendChild(el("span", "count-chip", chip));
      h.appendChild(el("span", "chev", "▾"));
      if (collapsedSet().has(title)) c.classList.add("collapsed");
      h.onclick = () => {
        const on = c.classList.toggle("collapsed");
        const s = collapsedSet(); on ? s.add(title) : s.delete(title);
        localStorage.setItem(COLLAPSE_KEY, JSON.stringify([...s]));
      };
      c.appendChild(h); return c;
    }
    function renderStatus(s) {
      const box = document.getElementById("status");
      box.innerHTML = "";
      const topMood = s.mood ? Object.entries(s.mood).sort((a, b) => b[1] - a[1])[0] : null;

      const ov = card("Mari");
      const state = el("div", "st-kv");
      state.appendChild(el("span", "k", "state"));
      const v = el("span", "v");
      const pill = el("span", "pill " + (s.asleep ? "asleep" : "awake"));
      pill.appendChild(el("span", "pdot"));
      pill.appendChild(el("span", null, s.asleep ? "asleep" : "awake"));
      v.appendChild(pill); state.appendChild(v); ov.appendChild(state);
      ov.appendChild(kvRow("familiarity", `${s.familiarity.value.toFixed(2)} · ${s.familiarity.label}`));
      const track = el("div", "fam-track"); const fi = el("i");
      fi.style.width = Math.round(s.familiarity.value * 100) + "%"; track.appendChild(fi); ov.appendChild(track);
      if (topMood && !s.asleep) ov.appendChild(kvRow("feeling", topMood[0]));
      box.appendChild(ov);

      if (s.mood) {
        const m = card("Mood");
        Object.entries(s.mood).forEach(([ch, val]) => m.appendChild(barRow(ch, val, MOOD_COLORS[ch])));
        box.appendChild(m);
      }
      if (s.drives) {
        const dr = card("Drives & energy");
        Object.entries(s.drives).forEach(([d, val]) => dr.appendChild(barRow(d, val, DRIVE_COLORS[d] || "#888")));
        box.appendChild(dr);
      }

      const mem = card("Memory", `${s.memory.active_count} · ${s.memory.core_count}★ · ${s.memory.superseded_count} retired`);
      if (s.memory.core.length) s.memory.core.forEach((c) => mem.appendChild(el("div", "st-mem core", c)));
      else mem.appendChild(el("div", "st-empty", "no core facts yet"));
      if (s.memory.superseded.length) {
        mem.appendChild(el("div", "st-sub", "recently updated / retired"));
        s.memory.superseded.forEach((o) => { const d = el("div", "st-old"); d.appendChild(el("s", null, o.content)); mem.appendChild(d); });
      }
      box.appendChild(mem);

      const p = card("Self-description");
      p.appendChild(el("div", s.persona ? "st-mem" : "st-empty", s.persona || "none yet — develops as you talk"));
      box.appendChild(p);

      const th = card("Private journal", s.thoughts.length ? String(s.thoughts.length) : null);
      if (s.thoughts.length) {
        s.thoughts.forEach((t) => {
          const d = el("div", "st-thought");
          if (t.mood) d.appendChild(el("span", "m", `${t.mood} · `));
          d.appendChild(document.createTextNode(t.content));
          th.appendChild(d);
        });
      } else { th.appendChild(el("div", "st-empty", "no thoughts yet — she reflects while you're away")); }
      box.appendChild(th);

      const intents = s.intentions || [];
      const ic = card("Intentions", intents.length ? String(intents.length) : null);
      if (intents.length) intents.forEach((i) => ic.appendChild(el("div", "st-mem", i.content)));
      else ic.appendChild(el("div", "st-empty", "none yet — she notes these while you're away"));
      box.appendChild(ic);

      const a = card("Activity");
      a.appendChild(kvRow("model", s.model || "—"));
      a.appendChild(kvRow("pending consolidation", String(s.pending_consolidation)));
      a.appendChild(kvRow("last reach-out", fmtAgo(s.last.reach_out_secs_ago)));
      a.appendChild(kvRow("last reflection", fmtAgo(s.last.reflect_secs_ago)));
      a.appendChild(kvRow("last persona edit", fmtAgo(s.last.persona_edit_secs_ago)));
      box.appendChild(a);

      // reflect her state in the header avatar + favicon
      curAsleep = !!s.asleep;
      if (s.asleep) {
        avatarEl.textContent = "😴"; avatarEl.classList.add("asleep"); avatarEl.style.boxShadow = "";
      } else {
        avatarEl.textContent = (botName[0] || "M"); avatarEl.classList.remove("asleep");
        avatarEl.style.boxShadow = (topMood && topMood[1] > 0.15) ? `0 0 12px ${MOOD_COLORS[topMood[0]]}` : "";
      }
      setFavicon();
    }
    async function pollStatus() {
      try { const s = await (await fetch("/status")).json(); if (s.ready) renderStatus(s); }
      catch (e) { /* transient; keep last render */ }
    }
    const savedPanel = localStorage.getItem("mari-panel");
    // Default the panel hidden on phones/tablets (it's an overlay there), shown on desktop.
    const statusHidden = savedPanel ? savedPanel === "off" : window.matchMedia("(max-width: 1080px)").matches;
    document.body.classList.toggle("no-status", statusHidden);
    document.getElementById("toggleStatus").onclick = () => {
      const off = document.body.classList.toggle("no-status");
      localStorage.setItem("mari-panel", off ? "off" : "on");
    };
    // On narrow screens, tapping outside the open overlay closes it.
    document.addEventListener("click", (e) => {
      if (window.matchMedia("(max-width: 1080px)").matches &&
          !document.body.classList.contains("no-status") &&
          !e.target.closest("#status") && e.target.id !== "toggleStatus") {
        document.body.classList.add("no-status");
        localStorage.setItem("mari-panel", "off");
      }
    });
    setInterval(pollStatus, 3000); pollStatus();

    // --- Memory inspector modal ---
    const memModal = document.getElementById("memModal");
    const memFilter = document.getElementById("memFilter");
    async function postJSON(url, body) {
      try {
        const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
        return await r.json();
      } catch (e) { return { ok: false, error: String(e) }; }
    }
    async function loadMemories() {
      const box = document.getElementById("memList");
      box.innerHTML = "";
      let data;
      try { data = await (await fetch("/memories")).json(); }
      catch (e) { box.innerHTML = '<div class="mem-empty">could not load memories</div>'; return; }
      const mems = data.memories || [];
      const active = mems.filter((m) => m.active).length;
      document.getElementById("memCount").textContent = `${active} active · ${mems.length - active} retired`;
      if (!mems.length) { box.innerHTML = '<div class="mem-empty">no memories yet — they form as you talk</div>'; return; }
      mems.forEach((m) => box.appendChild(memRow(m)));
      applyMemFilter();
    }
    function memRow(m) {
      const row = el("div", "mem-row");
      row.dataset.content = (m.content || "").toLowerCase();
      if (m.active) {
        const star = el("button", "star" + (m.core ? " on" : ""), m.core ? "★" : "☆");
        star.title = m.core ? "core — always in mind (click to demote)" : "click to make core";
        star.onclick = async () => { await postJSON("/memory/core", { id: m.id, core: !m.core }); loadMemories(); };
        row.appendChild(star);
        const inp = el("input", "mc"); inp.type = "text"; inp.value = m.content;
        row.appendChild(inp);
        if (m.category) row.appendChild(el("span", "cat", m.category));
        const save = el("button", "mbtn", "save");
        save.onclick = async () => {
          const val = inp.value.trim();
          if (!val || val === m.content) return;
          save.textContent = "…"; save.disabled = true;
          const r = await postJSON("/memory/edit", { id: m.id, content: val });
          if (!r.ok) alert("edit failed: " + (r.error || "unknown"));
          loadMemories();
        };
        row.appendChild(save);
      } else {
        row.appendChild(el("s", null, m.content));
        row.appendChild(el("span", "cat", "retired"));
      }
      const del = el("button", "mbtn del", "delete");
      del.onclick = async () => { await postJSON("/memory/delete", { id: m.id }); loadMemories(); };
      row.appendChild(del);
      return row;
    }
    function applyMemFilter() {
      const q = memFilter.value.trim().toLowerCase();
      document.querySelectorAll("#memList .mem-row").forEach((r) =>
        r.style.display = (!q || r.dataset.content.includes(q)) ? "" : "none");
    }
    memFilter.addEventListener("input", applyMemFilter);
    document.getElementById("manageMem").onclick = async () => { memFilter.value = ""; await loadMemories(); memModal.classList.remove("hidden"); };
    document.getElementById("memClose").onclick = () => memModal.classList.add("hidden");
    memModal.onclick = (e) => { if (e.target === memModal) memModal.classList.add("hidden"); };
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") memModal.classList.add("hidden"); });
    document.getElementById("memClear").onclick = async () => {
      if (!confirm("Delete ALL memories (active + retired)?\n\nConversations, mood and persona are kept. This cannot be undone.")) return;
      const r = await postJSON("/memory/clear");
      alert(r.ok ? `Cleared ${r.cleared} memories.` : "clear failed"); loadMemories();
    };
    document.getElementById("memReset").onclick = async () => {
      if (!confirm("FULL RESET\n\nWipe ALL memories, conversations, mood, drives, persona and thoughts — a factory-fresh Mari. This cannot be undone.\n\nContinue?")) return;
      const r = await postJSON("/admin/factory_reset", { confirm: true });
      if (r.ok) location.reload(); else alert("reset failed: " + (r.error || "unknown"));
    };

    // --- Conversation tabs ---
    function renderConversations(list, active) {
      const box = document.getElementById("convList");
      box.innerHTML = "";
      list.forEach((c) => {
        const item = el("div", "conv" + (c.id === active ? " active" : ""));
        const title = el("span", "title", c.title || "New chat");
        title.title = c.title || "New chat";
        item.appendChild(title);
        item.appendChild(el("span", "n", String(c.count)));
        const del = el("span", "del", "×");
        del.title = "delete conversation";
        del.onclick = (e) => {
          e.stopPropagation();
          if (confirm("Delete this conversation? (Mari's memories are kept.)")) wsSend({ type: "delete", id: c.id });
        };
        item.appendChild(del);
        item.onclick = () => { if (c.id !== active) wsSend({ type: "switch", id: c.id }); };
        item.ondblclick = () => { const t = prompt("Rename conversation:", c.title || ""); if (t != null) wsSend({ type: "rename", id: c.id, title: t }); };
        box.appendChild(item);
      });
    }
    document.getElementById("newConv").onclick = () => wsSend({ type: "new" });
  </script>
</body>
</html>
