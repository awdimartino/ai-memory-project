<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mari</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #171a21; --user: #2b5cff; --bot: #232733;
      --text: #e6e8ee; --muted: #8b90a0; --line: #262a35;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; display: flex; flex-direction: column;
      background: var(--bg); color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    header {
      padding: 12px 16px; border-bottom: 1px solid var(--line);
      display: flex; align-items: baseline; gap: 10px;
    }
    header h1 { font-size: 16px; margin: 0; }
    header .meta { color: var(--muted); font-size: 12px; }
    #log {
      flex: 1; overflow-y: auto; padding: 20px 16px;
      display: flex; flex-direction: column; gap: 12px; max-width: 820px;
      width: 100%; margin: 0 auto;
    }
    .row { display: flex; }
    .row.user { justify-content: flex-end; }
    .bubble {
      max-width: 78%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap;
      word-wrap: break-word;
    }
    .user .bubble { background: var(--user); color: #fff; border-bottom-right-radius: 4px; }
    .bot .bubble { background: var(--bot); border-bottom-left-radius: 4px; }
    .stats { color: var(--muted); font-size: 11px; margin: 2px 4px 0; }
    form {
      display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line);
      max-width: 820px; width: 100%; margin: 0 auto;
    }
    #input {
      flex: 1; resize: none; background: var(--panel); color: var(--text);
      border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
      font: inherit; max-height: 140px;
    }
    button {
      background: var(--user); color: #fff; border: 0; border-radius: 10px;
      padding: 0 18px; font: inherit; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: default; }
    .dot { color: var(--muted); }

    /* Per-turn inspector: memories recalled + emotion read + resulting mood. */
    .details { margin: 2px 4px 2px; max-width: 78%; }
    .details summary {
      color: var(--muted); font-size: 11px; cursor: pointer; list-style: none;
      user-select: none; padding: 2px 0;
    }
    .details summary::-webkit-details-marker { display: none; }
    .details summary::before { content: "▸ "; }
    .details[open] summary::before { content: "▾ "; }
    .td-body {
      margin-top: 6px; padding: 10px 12px; background: var(--panel);
      border: 1px solid var(--line); border-radius: 10px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .td-title {
      color: var(--muted); font-size: 10px; letter-spacing: .06em;
      text-transform: uppercase; margin-bottom: 6px;
    }
    .mem { font-size: 12px; padding: 3px 0; display: flex; gap: 8px; align-items: baseline; }
    .mem .pct { color: var(--muted); font-size: 11px; margin-left: auto; flex: none; }
    .td-empty { font-size: 12px; color: var(--muted); }
    .bar-row {
      display: grid; grid-template-columns: 92px 1fr 34px; align-items: center;
      gap: 8px; font-size: 12px; padding: 2px 0;
    }
    .bar-label { color: var(--text); text-transform: capitalize; }
    .bar { height: 7px; background: var(--line); border-radius: 4px; overflow: hidden; }
    .bar > i { display: block; height: 100%; border-radius: 4px; background: var(--user); }
    .bar-val { color: var(--muted); font-size: 11px; text-align: right; }

    /* Layout: conversation sidebar + chat + right status panel */
    #main { flex: 1; display: flex; min-height: 0; }
    #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #sidebar {
      width: 210px; flex: none; overflow-y: auto; border-right: 1px solid var(--line);
      padding: 10px 8px; display: flex; flex-direction: column; gap: 3px; background: #12141a;
    }
    #newConv {
      background: var(--bot); color: var(--text); border: 1px solid var(--line);
      padding: 8px 10px; border-radius: 8px; font-size: 13px; margin-bottom: 6px; text-align: left;
    }
    .conv {
      display: flex; align-items: center; gap: 6px; padding: 7px 8px; border-radius: 8px;
      cursor: pointer; font-size: 13px;
    }
    .conv:hover { background: var(--bot); }
    .conv.active { background: var(--bot); border-left: 2px solid var(--user); }
    .conv .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .conv .n { color: var(--muted); font-size: 11px; }
    .conv .del { color: var(--muted); font-size: 14px; opacity: 0; padding: 0 2px; }
    .conv:hover .del { opacity: .7; }
    .conv .del:hover { opacity: 1; color: #e5534b; }
    #status {
      width: 340px; flex: none; overflow-y: auto; border-left: 1px solid var(--line);
      padding: 14px 14px 40px; display: flex; flex-direction: column; gap: 18px; background: #12141a;
    }
    body.no-status #status { display: none; }
    .hbtn {
      background: transparent; color: var(--muted); border: 1px solid var(--line);
      padding: 3px 12px; font-size: 12px; border-radius: 8px;
    }
    #manageMem { margin-left: auto; }
    .hbtn:hover { color: var(--text); }

    /* Memory inspector modal */
    .modal {
      position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.6);
      display: flex; align-items: center; justify-content: center;
    }
    .modal.hidden { display: none; }
    .modal-box {
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
      width: min(760px, 94vw); max-height: 86vh; display: flex; flex-direction: column;
    }
    .modal-head {
      display: flex; align-items: center; padding: 13px 16px;
      border-bottom: 1px solid var(--line); font-weight: 600;
    }
    .modal-head .sub { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 8px; }
    .modal-head .xbtn {
      margin-left: auto; background: transparent; color: var(--muted); border: 0;
      font-size: 22px; line-height: 1; padding: 0 4px;
    }
    .mem-list {
      overflow-y: auto; padding: 6px 12px; display: flex; flex-direction: column;
    }
    .mem-row {
      display: flex; align-items: center; gap: 8px; padding: 7px 2px;
      border-bottom: 1px solid var(--line);
    }
    .mem-row .star {
      background: transparent; border: 0; color: var(--muted); font-size: 15px;
      padding: 0 2px; cursor: pointer; flex: none;
    }
    .mem-row .star.on { color: #e0a458; }
    .mem-row input.mc {
      flex: 1; min-width: 0; background: var(--bg); color: var(--text);
      border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; font: inherit; font-size: 13px;
    }
    .mem-row s { flex: 1; min-width: 0; color: #6b7080; font-size: 13px; }
    .mem-row .cat { color: var(--muted); font-size: 11px; flex: none; }
    .mem-row .mbtn {
      background: var(--bot); color: var(--text); border: 1px solid var(--line);
      padding: 4px 9px; font-size: 12px; border-radius: 7px; flex: none;
    }
    .mem-row .mbtn.del:hover { color: #e5534b; border-color: #e5534b; }
    .modal-foot {
      display: flex; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line);
    }
    .modal-foot .grow { flex: 1; }
    .danger {
      background: #3a1f22; color: #f0a8a0; border: 1px solid #5a2a2a;
      padding: 7px 14px; font-size: 13px; border-radius: 8px;
    }
    .danger:hover { background: #4a2529; }
    .mem-empty { color: var(--muted); font-size: 13px; padding: 24px; text-align: center; }
    .st-h {
      color: var(--muted); font-size: 10px; letter-spacing: .07em; text-transform: uppercase;
      margin-bottom: 7px;
    }
    .st-kv { font-size: 12px; display: flex; gap: 8px; align-items: baseline; padding: 1px 0; }
    .st-kv .k { color: var(--muted); }
    .st-kv .v { margin-left: auto; }
    .pill { font-size: 11px; padding: 1px 8px; border-radius: 10px; background: var(--bot); }
    .pill.asleep { background: #3a2f52; }
    .st-mem { font-size: 12px; padding: 2px 0; }
    .st-mem.core::before { content: "★ "; color: #e0a458; }
    .st-old { font-size: 11px; color: var(--muted); padding: 2px 0; }
    .st-old s { color: #6b7080; }
    .st-thought {
      font-size: 12px; padding: 2px 0 2px 8px; border-left: 2px solid var(--line); margin: 4px 0;
    }
    .st-thought .m { color: var(--muted); font-size: 10px; }
    .st-empty { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1 id="botname">Mari</h1>
    <span class="meta" id="model">connecting...</span>
    <button id="manageMem" class="hbtn" type="button">memory</button>
    <button id="toggleStatus" class="hbtn" type="button">status</button>
  </header>
  <div id="main">
    <aside id="sidebar">
      <button id="newConv" type="button">+ New conversation</button>
      <div id="convList"></div>
    </aside>
    <div id="chat">
      <div id="log"></div>
      <form id="form">
        <textarea id="input" rows="1" placeholder="Say something..." autocomplete="off"></textarea>
        <button id="send" type="submit">Send</button>
      </form>
    </div>
    <aside id="status"><div class="st-empty">loading…</div></aside>
  </div>

  <div id="memModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        Memory inspector <span class="sub" id="memCount"></span>
        <button id="memClose" class="xbtn" type="button" title="close">×</button>
      </div>
      <div id="memList" class="mem-list"></div>
      <div class="modal-foot">
        <button id="memClear" class="danger" type="button">clear all memories</button>
        <span class="grow"></span>
        <button id="memReset" class="danger" type="button">full reset</button>
      </div>
    </div>
  </div>

  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const modelEl = document.getElementById("model");
    const botnameEl = document.getElementById("botname");
    let botName = "Mari";
    let current = null; // active assistant bubble while streaming

    function addBubble(role, text) {
      const row = document.createElement("div");
      row.className = "row " + role;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      row.appendChild(bubble);
      log.appendChild(row);
      log.scrollTop = log.scrollHeight;
      return bubble;
    }

    function addStats(s) {
      const el = document.createElement("div");
      el.className = "stats";
      const approx = s.estimated ? "~" : "";
      el.textContent = `ttft ${s.ttft.toFixed(2)}s · ${s.tok_per_s.toFixed(1)} tok/s · ${approx}${s.tokens} tok`;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
    }

    // Distinct hue per mood channel so the six bars read at a glance.
    const MOOD_COLORS = {
      irritation: "#e5534b", warmth: "#e0a458", amusement: "#d9c04f",
      melancholy: "#6a8bd0", unease: "#9b7bd0", interest: "#4fbf8f",
    };

    // Internal drives + the energy body-cycle stat.
    const DRIVE_COLORS = { connection: "#4f9bd9", restlessness: "#d98f4f", energy: "#5cc98f" };

    function el(tag, cls, text) {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    }

    function barRow(label, value, color) {
      const row = el("div", "bar-row");
      row.appendChild(el("span", "bar-label", label));
      const bar = el("span", "bar");
      const fill = el("i");
      fill.style.width = Math.round(Math.max(0, Math.min(1, value)) * 100) + "%";
      if (color) fill.style.background = color;
      bar.appendChild(fill);
      row.appendChild(bar);
      row.appendChild(el("span", "bar-val", value.toFixed(2).replace(/^0/, "")));
      return row;
    }

    function section(title) {
      const s = el("div", "td-section");
      s.appendChild(el("div", "td-title", title));
      return s;
    }

    // Render the collapsible inspector: what Mari always knows + recalled + felt +
    // any tools she called this turn.
    function addDetails(recalled, emotion, core, tools) {
      recalled = recalled || [];
      core = core || [];
      tools = tools || [];
      const hasEmotion = emotion && emotion.mood;
      if (!recalled.length && !hasEmotion && !core.length && !tools.length) return;

      const details = el("details", "details");
      const summary = el("summary");
      const bits = [];
      if (core.length) bits.push(`${core.length} core`);
      bits.push(`${recalled.length} ${recalled.length === 1 ? "memory" : "memories"}`);
      if (tools.length) bits.push(`${tools.length} tool${tools.length === 1 ? "" : "s"}`);
      if (hasEmotion) {
        const top = Object.entries(emotion.mood).sort((a, b) => b[1] - a[1])[0];
        bits.push(`mood: ${top[0]}`);
      }
      summary.textContent = "inspect · " + bits.join(" · ");
      details.appendChild(summary);

      const body = el("div", "td-body");

      if (tools.length) {
        const ts = section("Tools called");
        tools.forEach((t) => {
          const row = el("div", "mem");
          row.appendChild(el("span", null, `${t.name}(${t.args || ""})`));
          row.appendChild(el("span", "pct", "🔧"));
          ts.appendChild(row);
          if (t.result) ts.appendChild(el("div", "td-empty", "→ " + t.result));
        });
        body.appendChild(ts);
      }

      if (core.length) {
        const coreSec = section("Core memory (always known)");
        core.forEach((c) => coreSec.appendChild(el("div", "mem", c)));
        body.appendChild(coreSec);
      }

      const mem = section("Recalled memories");
      if (recalled.length) {
        recalled.forEach((m) => {
          const row = el("div", "mem");
          row.appendChild(el("span", null, m.content));
          row.appendChild(el("span", "pct", Math.round(m.similarity * 100) + "%"));
          mem.appendChild(row);
        });
      } else {
        mem.appendChild(el("div", "td-empty", "none pulled for this turn"));
      }
      body.appendChild(mem);

      if (hasEmotion) {
        const det = section("Detected in your message");
        const found = emotion.detected || [];
        if (found.length) {
          found.forEach((d) => det.appendChild(barRow(d.label, d.score)));
        } else {
          det.appendChild(el("div", "td-empty", "neutral / nothing notable"));
        }
        body.appendChild(det);

        const mood = section("Mari's mood");
        Object.entries(emotion.mood).forEach(([ch, v]) =>
          mood.appendChild(barRow(ch, v, MOOD_COLORS[ch])));
        body.appendChild(mood);
      }

      details.appendChild(body);
      log.appendChild(details);
      log.scrollTop = log.scrollHeight;
    }

    const proto = location.protocol === "https:" ? "wss" : "ws";
    const socket = new WebSocket(`${proto}://${location.host}/ws`);

    socket.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      if (msg.type === "ready") {
        botName = msg.bot;
        botnameEl.textContent = msg.bot;
        modelEl.textContent = msg.model;
      } else if (msg.type === "conversations") {
        renderConversations(msg.list, msg.active);
      } else if (msg.type === "history_start") {
        log.innerHTML = "";   // switching/new conversation: clear the thread
        current = null;
      } else if (msg.type === "history") {
        addBubble(msg.role === "user" ? "user" : "bot", msg.content);
      } else if (msg.type === "proactive") {
        // Mari reached out on her own (from the tick loop) — render as a bot bubble.
        current = null;
        addBubble("bot", msg.content);
      } else if (msg.type === "waking") {
        // She was asleep (model unloaded); a cold reload is coming.
        const el = document.createElement("div");
        el.className = "stats";
        el.textContent = "waking up… (reloading the model)";
        log.appendChild(el);
        log.scrollTop = log.scrollHeight;
      } else if (msg.type === "start") {
        current = addBubble("bot", "");
      } else if (msg.type === "token") {
        if (!current) current = addBubble("bot", "");
        current.textContent += msg.text;
        log.scrollTop = log.scrollHeight;
      } else if (msg.type === "done") {
        current = null;
        addStats(msg.stats);
        addDetails(msg.recalled, msg.emotion, msg.core, msg.tools);
        setSending(false);
      } else if (msg.type === "error") {
        if (current) current.textContent += `\n[error: ${msg.message}]`;
        current = null;
        setSending(false);
      }
    };

    socket.onclose = () => { modelEl.textContent = "disconnected"; };

    function setSending(on) {
      sendBtn.disabled = on;
      input.disabled = on;
      if (!on) input.focus();
    }

    function submit() {
      const text = input.value.trim();
      if (!text || sendBtn.disabled) return;
      addBubble("user", text);
      socket.send(JSON.stringify({ type: "user", text }));
      input.value = "";
      input.style.height = "auto";
      setSending(true);
    }

    form.addEventListener("submit", (e) => { e.preventDefault(); submit(); });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
    });
    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 140) + "px";
    });

    // --- Status panel: poll /status and render Mari's whole state ---
    function fmtAgo(secs) {
      if (secs == null) return "—";
      if (secs < 60) return secs + "s ago";
      if (secs < 3600) return Math.round(secs / 60) + "m ago";
      return Math.round(secs / 3600) + "h ago";
    }
    function kvRow(k, v) {
      const r = el("div", "st-kv");
      r.appendChild(el("span", "k", k));
      r.appendChild(el("span", "v", v));
      return r;
    }
    function stSection(title) {
      const s = el("div", "st-sec");
      s.appendChild(el("div", "st-h", title));
      return s;
    }
    function renderStatus(s) {
      const box = document.getElementById("status");
      box.innerHTML = "";

      const ov = stSection("Mari");
      const state = el("div", "st-kv");
      state.appendChild(el("span", "k", "state"));
      const v = el("span", "v");
      v.appendChild(el("span", "pill" + (s.asleep ? " asleep" : ""), s.asleep ? "asleep 😴" : "awake"));
      state.appendChild(v);
      ov.appendChild(state);
      ov.appendChild(kvRow("familiarity", `${s.familiarity.value.toFixed(2)} · ${s.familiarity.label}`));
      box.appendChild(ov);

      if (s.mood) {
        const m = stSection("Mood");
        Object.entries(s.mood).forEach(([ch, val]) => m.appendChild(barRow(ch, val, MOOD_COLORS[ch])));
        box.appendChild(m);
      }

      if (s.drives) {
        const dr = stSection("Drives");
        Object.entries(s.drives).forEach(([d, val]) =>
          dr.appendChild(barRow(d, val, DRIVE_COLORS[d] || "#888")));
        box.appendChild(dr);
      }

      const mem = stSection(
        `Memory · ${s.memory.active_count} active · ${s.memory.core_count} core · ${s.memory.superseded_count} retired`);
      if (s.memory.core.length) {
        s.memory.core.forEach((c) => mem.appendChild(el("div", "st-mem core", c)));
      } else {
        mem.appendChild(el("div", "st-empty", "no core facts yet"));
      }
      if (s.memory.superseded.length) {
        mem.appendChild(el("div", "st-h", "recently updated / retired"));
        s.memory.superseded.forEach((o) => {
          const d = el("div", "st-old");
          d.appendChild(el("s", null, o.content));
          mem.appendChild(d);
        });
      }
      box.appendChild(mem);

      const p = stSection("Self-description");
      p.appendChild(el("div", s.persona ? "st-mem" : "st-empty",
        s.persona || "none yet — develops as you talk"));
      box.appendChild(p);

      const th = stSection("Recent thoughts (private journal)");
      if (s.thoughts.length) {
        s.thoughts.forEach((t) => {
          const d = el("div", "st-thought");
          if (t.mood) d.appendChild(el("span", "m", `[${t.mood}] `));
          d.appendChild(document.createTextNode(t.content));
          th.appendChild(d);
        });
      } else {
        th.appendChild(el("div", "st-empty", "no thoughts yet — she reflects while you're away"));
      }
      box.appendChild(th);

      const a = stSection("Activity");
      a.appendChild(kvRow("model", s.model || "—"));
      a.appendChild(kvRow("pending consolidation", String(s.pending_consolidation)));
      a.appendChild(kvRow("last reach-out", fmtAgo(s.last.reach_out_secs_ago)));
      a.appendChild(kvRow("last reflection", fmtAgo(s.last.reflect_secs_ago)));
      a.appendChild(kvRow("last persona edit", fmtAgo(s.last.persona_edit_secs_ago)));
      box.appendChild(a);
    }
    async function pollStatus() {
      try {
        const s = await (await fetch("/status")).json();
        if (s.ready) renderStatus(s);
      } catch (e) { /* transient; keep last render */ }
    }
    document.getElementById("toggleStatus").onclick = () =>
      document.body.classList.toggle("no-status");
    setInterval(pollStatus, 3000);
    pollStatus();

    // --- Memory inspector modal: view / edit / delete / clear / full reset ---
    const memModal = document.getElementById("memModal");

    async function postJSON(url, body) {
      try {
        const r = await fetch(url, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body || {}),
        });
        return await r.json();
      } catch (e) { return { ok: false, error: String(e) }; }
    }

    async function loadMemories() {
      const box = document.getElementById("memList");
      box.innerHTML = "";
      let data;
      try { data = await (await fetch("/memories")).json(); }
      catch (e) { box.innerHTML = '<div class="mem-empty">could not load memories</div>'; return; }
      const mems = data.memories || [];
      const active = mems.filter((m) => m.active).length;
      document.getElementById("memCount").textContent =
        `${active} active · ${mems.length - active} retired`;
      if (!mems.length) {
        box.innerHTML = '<div class="mem-empty">no memories yet — they form as you talk</div>';
        return;
      }
      mems.forEach((m) => box.appendChild(memRow(m)));
    }

    function memRow(m) {
      const row = el("div", "mem-row");
      if (m.active) {
        const star = el("button", "star" + (m.core ? " on" : ""), m.core ? "★" : "☆");
        star.title = m.core ? "core — always in mind (click to demote)" : "click to make core";
        star.onclick = async () => { await postJSON("/memory/core", { id: m.id, core: !m.core }); loadMemories(); };
        row.appendChild(star);

        const inp = el("input", "mc"); inp.type = "text"; inp.value = m.content;
        row.appendChild(inp);
        if (m.category) row.appendChild(el("span", "cat", m.category));

        const save = el("button", "mbtn", "save");
        save.onclick = async () => {
          const v = inp.value.trim();
          if (!v || v === m.content) return;
          save.textContent = "…"; save.disabled = true;
          const r = await postJSON("/memory/edit", { id: m.id, content: v });
          if (!r.ok) alert("edit failed: " + (r.error || "unknown"));
          loadMemories();
        };
        row.appendChild(save);
      } else {
        row.classList.add("retired");
        row.appendChild(el("s", null, m.content));
        row.appendChild(el("span", "cat", "retired"));
      }
      const del = el("button", "mbtn del", "delete");
      del.onclick = async () => { await postJSON("/memory/delete", { id: m.id }); loadMemories(); };
      row.appendChild(del);
      return row;
    }

    document.getElementById("manageMem").onclick = async () => {
      await loadMemories();
      memModal.classList.remove("hidden");
    };
    document.getElementById("memClose").onclick = () => memModal.classList.add("hidden");
    memModal.onclick = (e) => { if (e.target === memModal) memModal.classList.add("hidden"); };

    document.getElementById("memClear").onclick = async () => {
      if (!confirm("Delete ALL memories (active + retired)?\n\nConversations, mood and persona are kept. This cannot be undone.")) return;
      const r = await postJSON("/memory/clear");
      alert(r.ok ? `Cleared ${r.cleared} memories.` : "clear failed");
      loadMemories();
    };
    document.getElementById("memReset").onclick = async () => {
      if (!confirm("FULL RESET\n\nWipe ALL memories, conversations, mood, drives, persona and thoughts — a factory-fresh Mari. This cannot be undone.\n\nContinue?")) return;
      const r = await postJSON("/admin/factory_reset", { confirm: true });
      if (r.ok) location.reload();
      else alert("reset failed: " + (r.error || "unknown"));
    };

    // --- Conversation tabs (sidebar) ---
    function renderConversations(list, active) {
      const box = document.getElementById("convList");
      box.innerHTML = "";
      list.forEach((c) => {
        const item = el("div", "conv" + (c.id === active ? " active" : ""));
        const title = el("span", "title", c.title || "New chat");
        title.title = c.title || "New chat";
        item.appendChild(title);
        item.appendChild(el("span", "n", String(c.count)));
        const del = el("span", "del", "×");
        del.title = "delete conversation";
        del.onclick = (e) => {
          e.stopPropagation();
          if (confirm("Delete this conversation? (Mari's memories are kept.)"))
            socket.send(JSON.stringify({ type: "delete", id: c.id }));
        };
        item.appendChild(del);
        item.onclick = () => {
          if (c.id !== active) socket.send(JSON.stringify({ type: "switch", id: c.id }));
        };
        item.ondblclick = () => {
          const t = prompt("Rename conversation:", c.title || "");
          if (t != null) socket.send(JSON.stringify({ type: "rename", id: c.id, title: t }));
        };
        box.appendChild(item);
      });
    }
    document.getElementById("newConv").onclick = () =>
      socket.send(JSON.stringify({ type: "new" }));
  </script>
</body>
</html>
